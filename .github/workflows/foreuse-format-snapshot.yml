# Temporary, read-only formatting snapshot for this feature PR.
# This file is removed from the PR after transferring the formatted text.
name: Foreuse format snapshot
on:
  push:
    branches:
      - feature/foreuse-volante-v1
permissions:
  contents: read
jobs:
  snapshot:
    name: Formatting snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format changed sources locally (not pushed)
        run: npm exec prettier -- --write src/main.ts src/ui/touch-controls.ts src/style.css scripts/visual-check.mjs
      - name: Output formatted snapshots for bot review
        run: |
          python3 - <<'PY'
          import json
          paths = ["src/main.ts", "src/ui/touch-controls.ts", "src/style.css", "scripts/visual-check.mjs"]
          for path in paths:
              with open(path, encoding="utf-8") as f:
                  encoded=json.dumps(f.read(), ensure_ascii=True)
              for index in range(0, len(encoded), 1600):
                  print("FMT:" + path + ":" + str(index // 1600) + ":" + encoded[index:index+1600], flush=True)
          PY
