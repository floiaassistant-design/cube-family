name: Temporary siege branch formatter (read only)
on:
  push:
    branches: [feat/cinq-bastions-siege]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - 'src/game/siege/fortress-store.ts'
          - 'src/game/siege/fortress.ts'
          - 'src/game/siege/session.ts'
          - 'src/game/siege/siege.test.ts'
          - 'src/game/wildlife.ts'
          - 'src/main.ts'
          - 'src/render/creature-model-view.ts'
          - 'src/render/creature-view.ts'
          - 'src/render/siege-zombie-model.ts'
          - 'src/style.css'
          - 'src/ui/siege-panel.ts'
          - 'src/world/edit-store.ts'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print formatter output for offline application
        env:
          TARGET: ${{ matrix.file }}
        run: |
          echo "FILE_START:${TARGET}"
          npx --no-install prettier "${TARGET}" | base64 -w0 | sed 's/^/FORMATTED_B64:/'
          echo "FILE_END:${TARGET}"
