name: Vérification web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-family-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  browser:
    name: Tests navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run build:e2e
      - run: bash scripts/run-browser-check.sh

  security:
    name: Sécurité et dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Auditer les trois verrous npm
        run: |
          status=0
          npm audit --package-lock-only --ignore-scripts --audit-level=moderate || status=1
          npm audit --prefix desktop --package-lock-only --ignore-scripts --audit-level=moderate || status=1
          npm audit --prefix mobile --package-lock-only --ignore-scripts --audit-level=moderate || status=1
          exit "$status"
      - name: Vérifier les workflows et rechercher les secrets
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 60 \
            --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --max-time 60 \
            --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256sum --check <<'SHA256'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          SHA256
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          tar --extract --gzip --file actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          status=0
          "$RUNNER_TEMP/actionlint" .github/workflows/verify.yml || status=1
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts='--all' . || status=1
          exit "$status"
